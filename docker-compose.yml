version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: college_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: college_db
      MYSQL_USER: college_user
      MYSQL_PASSWORD: college_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
